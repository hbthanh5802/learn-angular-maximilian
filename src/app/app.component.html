<app-header></app-header>
<main>
  <ul id="users">
    @for (user of userList; track user.id) {
      <li>
        <app-user
          userId="{{ user.id }}"
          [avatar]="user.avatar"
          [name]="user.name"
          (customSelect)="onSelectUser($event)"
          (customAnotherSelect)="onSelectUser($event)"
          [isSelected]="user.id === selectedUserId"
        />
      </li>
    }
  </ul>

  <app-tasks [userId]="selectedUserId" />

  <app-task-list />
</main>
